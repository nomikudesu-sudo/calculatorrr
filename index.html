
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink Calculator 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #ffb6d9, #d9a7ff, #ffc1e3);
    font-family: Arial, sans-serif;
}

.calculator {
    width: 370px;
    max-width: 100%;
    padding: 24px;
    border-radius: 30px;
    background: linear-gradient(145deg, #fff0f8, #f8d5eb);
    box-shadow: 0 20px 60px #a83d8155;
    border: 2px solid white;
}

h2 {
    text-align: center;
    color: #d63384;
    margin: 0 0 20px;
    letter-spacing: 2px;
}

#history {
    color: #bb6b9b;
    text-align: right;
    min-height: 22px;
    font-size: 14px;
}

#display {
    width: 100%;
    height: 75px;
    border: none;
    outline: none;
    border-radius: 18px;
    background: #fff;
    box-shadow: inset 0 3px 10px #e9b4d4;
    color: #a52a70;
    font-size: 30px;
    text-align: right;
    padding: 15px;
    margin-bottom: 18px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
}

button {
    border: none;
    height: 53px;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    color: #a52a70;
    background: white;
    cursor: pointer;
    box-shadow: 0 4px 8px #d98ab855;
    transition: .2s;
}

button:hover {
    transform: translateY(-3px);
    background: #ffe1f1;
    box-shadow: 0 6px 12px #d76ba955;
}

button:active {
    transform: scale(.93);
}

.operator {
    background: #ffb3d9;
}

.function {
    background: #e8c4ff;
    color: #853bb0;
    font-size: 14px;
}

.clear {
    background: #ff72ad;
    color: white;
}

.equal {
    background: linear-gradient(135deg, #ec4899, #be5bd5);
    color: white;
}

.zero {
    grid-column: span 2;
}

.footer {
    text-align: center;
    color: #d45a9b;
    font-size: 12px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="calculator">

<h2>♡ PINK CALCULATOR ♡</h2>

<div id="history"></div>
<input id="display" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearAll()">AC</button>
<button onclick="del()">DEL</button>
<button class="function" onclick="append('(')">(</button>
<button class="function" onclick="append(')')">)</button>
<button class="operator" onclick="append('/')">÷</button>

<button class="function" onclick="sqrt()">√</button>
<button class="function" onclick="square()">x²</button>
<button class="function" onclick="append('**')">xʸ</button>
<button class="function" onclick="append('%')">%</button>
<button class="operator" onclick="append('*')">×</button>

<button class="function" onclick="trig('sin')">sin</button>
<button class="function" onclick="trig('cos')">cos</button>
<button class="function" onclick="trig('tan')">tan</button>
<button onclick="append('7')">7</button>
<button class="operator" onclick="append('-')">−</button>

<button class="function" onclick="log()">log</button>
<button class="function" onclick="ln()">ln</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('+')">+</button>

<button class="function" onclick="append('Math.PI')">π</button>
<button class="function" onclick="append('Math.E')">e</button>
<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>

<button class="function" onclick="factorial()">n!</button>
<button class="function" onclick="append('.')">.</button>
<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>

<button class="function" onclick="reciprocal()">1/x</button>
<button class="function" onclick="toggleSign()">±</button>
<button class="zero" onclick="append('0')">0</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<div class="footer">
    Made with ♡ Pink Calculator
</div>

</div>

<script>
const display = document.getElementById("display");
const history = document.getElementById("history");

function append(value) {
    if (display.value === "0" || display.value === "Алдаа") {
        display.value = value;
    } else {
        display.value += value;
    }
}

function clearAll() {
    display.value = "0";
    history.innerText = "";
}

function del() {
    display.value = display.value.slice(0,-1) || "0";
}

function calculate() {
    try {
        let exp = display.value;

        if (!/^[0-9+\-*/().%a-zA-Z ]+$/.test(exp) ||
            /[a-zA-Z]/.test(exp.replace(/Math\.(PI|E)/g, ""))) {
            throw Error();
        }

        let result = Function('"use strict";return (' + exp + ')')();

        if (!Number.isFinite(result)) throw Error();

        history.innerText = display.value + " =";
        display.value = String(Number(result.toFixed(10)));
    } catch {
        display.value = "Алдаа";
    }
}

function sqrt() {
    let n = Number(display.value);
    display.value = n >= 0 ? Math.sqrt(n) : "Алдаа";
}

function square() {
    display.value = Number(display.value) ** 2;
}

function trig(type) {
    let n = Number(display.value) * Math.PI / 180;
    let result = Math[type](n);
    display.value = Number(result.toFixed(10));
}

function log() {
    let n = Number(display.value);
    display.value = n > 0 ? Math.log10(n) : "Алдаа";
}

function ln() {
    let n = Number(display.value);
    display.value = n > 0 ? Math.log(n) : "Алдаа";
}

function factorial() {
    let n = Number(display.value);
    if (!Number.isInteger(n) || n < 0 || n > 170) {
        display.value = "Алдаа";
        return;
    }
    let result = 1;
    for (let i = 2; i <= n; i++) result *= i;
    display.value = result;
}

function reciprocal() {
    let n = Number(display.value);
    display.value = n !== 0 ? 1/n : "Алдаа";
}

function toggleSign() {
    let n = Number(display.value);
    display.value = String(-n);
}
</script>

</body>
</html>
